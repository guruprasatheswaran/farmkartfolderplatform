# ==========================================
# FarmKart - MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/farmkart?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=guru123

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Server
# ==========================================

server.port=8080
server.error.include-message=never